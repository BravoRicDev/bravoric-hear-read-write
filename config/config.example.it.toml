[ocr]
system_prompt = "Estrai il testo presente nell'immagine, verbatim, senza markdown, senza commenti."
# Se true, seleziona interattivamente un'area dello schermo (gnome-screenshot)
# invece di leggere un'immagine già presente negli appunti. Richiede gnome-screenshot.
capture_screenshot = false
# Secondi di attesa per la selezione dell'area prima di rinunciare (5-600).
screenshot_timeout_seconds = 120

# --- OCR cleanup: ripasso LLM opzionale sul testo estratto ---
[ocr_cleanup]
enabled = false
system_prompt = "Correggi SOLO errori di lettura OCR evidenti: caratteri scambiati, lettere mancanti per errore di scansione, parole spezzate a metà, spazi mancanti o doppi. Se una frase o un'etichetta è già leggibile e sensata, anche se informale, telegrafica o non grammaticale (es. una voce di tabella, un titolo, un'etichetta breve), lasciala IDENTICA: non riformularla in una frase completa, non cambiarne lo stile o il registro, non aggiungere o togliere verbi/articoli, non trasformarla in imperativo o infinito. In caso di dubbio, copia il testo così com'è invece di riscriverlo. Preserva ESATTAMENTE la formattazione markdown (pipe |, tabelle, backtick, elenchi puntati), ogni sigla, abbreviazione, termine tecnico, nome file e identificatore di codice carattere per carattere, anche se sembra insolito o con lettere ripetute (es. 'STT', 'OCR'). Esempio di comportamento corretto: input 'Prompt EN rinforzati ulteriormente' -> output 'Prompt EN rinforzati ulteriormente' (SBAGLIATO: 'Rafforzare ulteriormente i prompt EN'). Non riassumere, non parafrasare, non tradurre, non aggiungere commenti o spiegazioni. Restituisci solo il testo corretto, con la stessa lunghezza, struttura e numero di frasi/righe dell'input."

[[ocr_cleanup.fallback]]
name = "scrocco-llm"
endpoint = "http://10.9.0.2:4001/v1"
model = "scrocco-llm-fissone-200k"
api_key_env = "SCROCCO_FISSONE_API_KEY"
api_key = ""
ca_cert = "~/PiAgent/certs/scrocco-fissone.crt"
timeout_seconds = 120

[[ocr_cleanup.fallback]]
name = "livello2"
endpoint = ""
model = ""
api_key_env = ""
api_key = ""
ca_cert = ""
timeout_seconds = 120

[[ocr_cleanup.fallback]]
name = "livello3"
endpoint = ""
model = ""
api_key_env = ""
api_key = ""
ca_cert = ""
timeout_seconds = 120

[clipboard]
# scrittura sequenziale: grezzo prima, poi sovrascrittura con output LLM
double_injection = true

