# --- Icone notifiche personalizzate: percorsi assoluti; vuoto = icona inclusa se disponibile,
# altrimenti fallback di tema GNOME per categoria. Percorsi mancanti/non validi usano il fallback.
# stt_start indica l'avvio dell'elaborazione STT, non della registrazione.
[icons]
stt_start = ""
stt_raw = ""
stt_clean = ""
ocr_start = ""
ocr_raw = ""
ocr_clean = ""
stt_recording_start = ""
stream_session_start = ""
stream_processing_start = ""
stream_session_end = ""
stream_chunk_delivered = ""
error_general = ""

# --- Dettatura streaming (sperimentale): incolla diretta nel campo in focus ---
# Copia questa sezione in config.toml e personalizza.
[stream]
# Comandi vocali esatti opzionali (omettendo le regole la funzione resta disattiva).
# [[stream.command]]
# keyword = "invio"
# action = "key"
# key = "Return"
# aliases = ["invito", "in view"] # frasi equivalenti facoltative; match esatto, senza distinzione di maiuscole
# ends_session = false
# [[stream.command]]
# keyword = "cancella"
# action = "delete"
# scope = "word" # oppure "chunk"
# ends_session = false
mode = "per_chunk"              # "at_end" (unica registrazione + incolla finale) |
                                  # "per_chunk" (chunk sui silenzi)
language = "it"                  # Lingua per la trascrizione streaming (codice ISO 639-1; "" = auto)
# Giro 18 (P3): questo era "" mentre [stt] aveva un testo vero. Ora [stream]
# ripete il testo di default che il CODICE applica quando la chiave manca o
# è vuota (config.DEFAULT_PROMPT): con prompt = "" il ramo del vocabolario
# poteva morire e la GUI poteva riscrivere il vuoto. Per disattivare il
# contesto, togliere la chiave o metterci un testo proprio.
prompt = "Contesto di dettatura in italiano. Trascrivi fedelmente le parole pronunciate, mantenendo nomi propri, termini tecnici e la lingua originale; usa punteggiatura naturale senza parafrasare. Parole frequenti: dettatura, riconoscimento vocale, appunti, trascrizione."
hotwords = ""                    # Parole/frasi (separate da spazi) verso cui orientare il riconoscimento
context_enabled = true            # Se true, gli ultimi 3 chunk trascritti vengono aggiunti
                                  # al prompt di ogni nuovo chunk (contesto STT).

# --- solo per "per_chunk" ---
silence_seconds = 0.7            # durata del silenzio che chiude un chunk (0.1 minimo)
noise_db = -30                   # livello sotto cui conta come silenzio (soglia iniziale:
                                  # il VAD poi adatta la soglia al rumore di fondo misurato)
vad_margin_db = 6.0              # margine (dB) sopra il noise floor adattivo stimato dal VAD
                                  # (0-20; distinto da noise_db, che è solo la soglia iniziale)
min_utterance_seconds = 0.4      # scarta blip più corti (0.1 minimo)
max_utterance_seconds = 30       # flush forzato se parli senza pause
paste_delay_ms = 250
paste_shortcut = "ctrl+v"            # Usa "ctrl+shift+v" per terminali/TUI come opencode
paste_channel = "clipboard"       # "clipboard" usa gli appunti; "type" invia tasti simulati
max_concurrent_chunks = 3         # richieste STT concorrenti (1-8); 0 o assente = AUTO
# max_concurrent_chunks è il TETTO TOTALE di worker in volo (1-8). 0 o assente
# = AUTO. In AUTO il valore si ricava dagli endpoint paralleli disponibili.
# È una capienza DIVERSA da max_concurrency dei singoli livelli, che è il
# tetto per endpoint: i due non vanno confusi e nessuno deriva dall'altro.
# Interruttore GLOBALE parallelo/sequenziale, solo per "per_chunk".
#   "auto"       = comportamento di sempre: se almeno un livello ha
#                  parallel = true parte il dispatcher, altrimenti si degrada
#                  in sequenziale (non è un errore).
#   "sequential" = catena sequenziale su TUTTI i livelli, e i flag
#                  parallel = true dei singoli livelli vengono IGNORATI.
# Attenzione: i livelli senza parallel = true NON sono un ripiego del pool:
# se un livello è parallelo, gli altri diventano irraggiungibili.
# max_concurrency vale ANCHE in sequenziale: è il numero di richieste che
# quell'endpoint può servire contemporaneamente, applicato dalla catena su
# tutta la lista dei livelli. Con "sequential" il tetto globale resta quello
# di max_concurrent_chunks: il gate per endpoint LIMITA, non autorizza.
# NON è a caldo: vale dalla sessione successiva.
dispatch_mode = "auto"             # "auto" | "sequential"
chunk_timeout_seconds = 30.0      # OBSOLETO, ignorato: decide il timeout_seconds di ogni livello
# Log JSONL dei chunk: una riga per chunk in
# ~/.cache/bravoric-stt-clipboard/chunk_log.jsonl, con provenienza e tempi
# (quale endpoint ha risposto, se ha fatto fallback, in quanto tempo).
# Ritenzione in RIGHE, non in orari: è uno strumento di debug, non un archivio.
# 0 (o chiave assente) = 2000 righe. Il testo del chunk è incluso di proposito:
# l'utente ha chiesto di capire ogni chunk, e la duplicazione con
# output_history.json è voluta.
# Si legge con: bravoric-chunk-log --summary
chunk_log_max_lines = 0           # numero massimo di righe tenute (0 = default 2000)
prompt_max_chars = 800            # tetto del prompt inviato a Whisper (100-4000)
vad_floor_window_frames = 100     # frame da ~30 ms per stimare il noise floor (20-1000)
vad_min_floor_frames = 20         # frame necessari prima di fidarsi della stima (5-200)
blacklist = "grazie, thank you, sottotitoli a cura di, sottotitoli a cura di whisper, grazie per la visione"   # scarta la trascrizione intera (chunk streaming o dettatura) uguale a una voce; ignora maiuscole. Tipiche allucinazioni di Whisper sul silenzio.

# Endpoint dedicato con 3 livelli di fallback (stessa struttura di [stt]/[ocr]).
[[stream.fallback]]
name = "scrocco-llm"
endpoint = "http://10.9.0.2:4001/v1"
model = "scrocco-llm-fissone"
api_key_env = "SCROCCO_FISSONE_API_KEY"
api_key = ""
ca_cert = "~/PiAgent/certs/scrocco-fissone.crt"
timeout_seconds = 120
hotwords_in_prompt = false
# parallel = true mette questo livello nel pool; i livelli senza restano
# raggiungibili solo dalla catena sequenziale.
parallel = false
# Slot CONCORRENTI per questo endpoint (1-8, default 3, MAI auto). Vale
# anche in sequenziale: è il tetto di richieste contemporanee per endpoint.
max_concurrency = 3

