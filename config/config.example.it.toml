retention_hours = 0

[storage.stt_raw]
enabled = false
retention_hours = 0

[storage.stt_clean]
enabled = false
retention_hours = 0

[storage.ocr_original]
enabled = false
retention_hours = 0

[storage.ocr_raw]
enabled = false
retention_hours = 0

[storage.ocr_clean]
enabled = false
retention_hours = 0

