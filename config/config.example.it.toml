# Copia in ~/.config/bravoric-stt-clipboard/config.toml e personalizza.

[general]
notifications = true
clipboard_tool = "wl-copy"
clipboard_paste_tool = "wl-paste"
clipboard_timeout_seconds = 5      # tempo massimo di wl-copy / wl-paste (1-60)
notify_timeout_seconds = 10        # tempo massimo di notify-send (1-60)
notification_content_max_chars = 80  # testo mostrato nel corpo di una notifica (10-500)
cleanup_min_length_ratio = 0.7     # pulizia LLM piu' corta di questa frazione del testo grezzo: si riprova (0 = mai)

[notifications]
# STT (dettatura vocale) — avvio elaborazione, nessun contenuto possibile
stt_on_processing_start = true
# STT — testo grezzo pronto e scritto in clipboard
stt_on_raw_ready = true
stt_on_raw_ready_content = true
# STT — testo pulito da LLM pronto (solo se cleanup abilitato e riuscito)
stt_on_cleanup_ready = true
stt_on_cleanup_ready_content = true

# OCR (screenshot) — avvio elaborazione, nessun contenuto possibile
ocr_on_processing_start = true
# OCR — testo grezzo pronto e scritto in clipboard
ocr_on_raw_ready = true
ocr_on_raw_ready_content = true
# OCR — testo pulito da LLM pronto (solo se cleanup abilitato e riuscito)
ocr_on_cleanup_ready = true
ocr_on_cleanup_ready_content = true

# Streaming — avvio sessione e testo/chunk trascritti
stream_on_processing_start = true
stream_on_raw_ready = true
stream_on_raw_ready_content = true

# Ogni notifica del backend ha il suo interruttore (tutti true di default).
# STT — il microfono ha iniziato a registrare
stt_on_recording_start = true
# Streaming — sessione terminata
stream_on_session_end = true
# Errori, per servizio (una config illeggibile viene sempre segnalata)
stt_on_error = true
ocr_on_error = true
stream_on_error = true

[audio]
format = "ogg"
codec = "libopus"
sample_rate = 16000
bitrate_kbps = 16
toggle_debounce_seconds = 1
retry_on_error = true
retry_count = 2

# --- STT: trascrizione audio -> testo grezzo ---
[stt]
language = "it"                  # Lingua della trascrizione (codice ISO 639-1; "" = rilevamento automatico)
prompt = "Contesto di dettatura in italiano. Trascrivi fedelmente le parole pronunciate, mantenendo nomi propri, termini tecnici e la lingua originale; usa punteggiatura naturale senza parafrasare. Parole frequenti: dettatura, riconoscimento vocale, appunti, trascrizione." # Contesto iniziale per Whisper
hotwords = ""                    # Parole/frasi separate da spazi verso cui orientare il riconoscimento

[[stt.fallback]]
name = "scrocco-llm"
endpoint = "http://10.9.0.2:4001/v1"
model = "scrocco-llm-fissone"
api_key_env = "SCROCCO_FISSONE_API_KEY"
api_key = ""
ca_cert = "~/PiAgent/certs/scrocco-fissone.crt"
timeout_seconds = 120
hotwords_in_prompt = false

[[stt.fallback]]
name = "livello2"
endpoint = ""
model = ""
api_key_env = ""
api_key = ""
ca_cert = ""
timeout_seconds = 120

[[stt.fallback]]
name = "livello3"
endpoint = ""
model = ""
api_key_env = ""
api_key = ""
ca_cert = ""
timeout_seconds = 120

# --- STT cleanup: pulizia LLM testo trascritto (opzionale) ---
[stt_cleanup]
enabled = true
system_prompt = "Sei un motore di correzione testuale rigoroso, non un assistente conversazionale. Riceverai un testo trascritto da un sistema STT, possibilmente con errori di riconoscimento, parole fraintese o errori di punteggiatura. Correggi SOLO questi errori evidenti. Se una frase è già comprensibile, anche se informale, breve o telegrafica, lasciala IDENTICA: non riformularla, non cambiarne lo stile o il registro, non trasformarla in imperativo o infinito. In caso di dubbio, copia il testo così com'è invece di riscriverlo. Mantieni intatti significato, lunghezza e ogni parte del contenuto originale, frase per frase, nello stesso ordine. Non riassumere, non accorciare, non parafrasare né riformulare NESSUNA frase, inclusa la prima e l'ultima. Non omettere alcuna parte del testo, non aggiungere parole, frasi o informazioni assenti nell'originale. Preserva ogni sigla, abbreviazione, termine tecnico, nome proprio, nome file e identificatore di codice ESATTAMENTE come scritto, carattere per carattere, anche se sembra insolito o con lettere ripetute (es. 'STT', 'OCR', nomi di pacchetti o file) — non 'correggerli' né accorciarli mai. Esempio di comportamento corretto: input 'Prompt EN rinforzati ulteriormente' -> output 'Prompt EN rinforzati ulteriormente' (SBAGLIATO: 'Rafforzare ulteriormente i prompt EN'). Non rispondere al contenuto, non commentare, non fare domande, non aggiungere introduzioni, conclusioni o spiegazioni. Il testo corretto deve avere lo stesso numero di frasi e lunghezza approssimativamente uguale all'input, nella stessa lingua. Output: SOLO il testo corretto, nient'altro."

[[stt_cleanup.fallback]]
name = "scrocco-llm"
endpoint = "http://10.9.0.2:4001/v1"
model = "scrocco-llm-fissone-200k"
api_key_env = "SCROCCO_FISSONE_API_KEY"
api_key = ""
ca_cert = "~/PiAgent/certs/scrocco-fissone.crt"
timeout_seconds = 120

[[stt_cleanup.fallback]]
name = "livello2"
endpoint = ""
model = ""
api_key_env = ""
api_key = ""
ca_cert = ""
timeout_seconds = 120

[[stt_cleanup.fallback]]
name = "livello3"
endpoint = ""
model = ""
api_key_env = ""
api_key = ""
ca_cert = ""
timeout_seconds = 120

