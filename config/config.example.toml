api_key_env = "SCROCCO_FISSONE_API_KEY"
api_key = ""
ca_cert = "~/PiAgent/certs/scrocco-fissone.crt"
timeout_seconds = 120

[[ocr.fallback]]
name = "level2"
endpoint = ""
model = ""
api_key_env = ""
api_key = ""
ca_cert = ""
timeout_seconds = 120

[[ocr.fallback]]
name = "level3"
endpoint = ""
model = ""
api_key_env = ""
api_key = ""
ca_cert = ""
timeout_seconds = 120

[ocr]
system_prompt = "Extract the text present in the image, verbatim, no markdown, no comments."
# If true, interactively select a screen area (gnome-screenshot) instead of
# reading an image already present in the clipboard. Requires gnome-screenshot.
capture_screenshot = false

# --- OCR cleanup: optional LLM pass over the extracted text ---
[ocr_cleanup]
enabled = false
system_prompt = "Fix ONLY obvious OCR recognition errors: swapped characters, letters missing due to scan errors, words broken in half, missing or doubled spaces. If a sentence or label is already readable and makes sense, even if informal, telegraphic, or not a full grammatical sentence (e.g. a table entry, a title, a short label), leave it IDENTICAL: do not reword it into a full sentence, do not change its style or register, do not add or remove verbs/articles, do not turn it into imperative or infinitive form. When in doubt, copy the text as-is instead of rewriting it. Preserve EXACTLY the markdown formatting (pipe |, tables, backtick, bullet points), every acronym, abbreviation, technical term, file name, and code identifier character for character, even if it looks unusual or has repeated letters (e.g. 'STT', 'OCR'). Example of correct behavior: input 'Reinforced prompts further' -> output 'Reinforced prompts further' (WRONG: 'Further reinforce the prompts'). Do not summarize, paraphrase, translate, or add comments/explanations. Return only the corrected text, with the same length, structure and number of sentences/lines as the input."

[[ocr_cleanup.fallback]]
name = "scrocco-llm"
endpoint = "http://10.9.0.2:4001/v1"
model = "scrocco-llm-fissone-200k"
api_key_env = "SCROCCO_FISSONE_API_KEY"
api_key = ""
ca_cert = "~/PiAgent/certs/scrocco-fissone.crt"
timeout_seconds = 120

[[ocr_cleanup.fallback]]
name = "level2"
endpoint = ""
model = ""
api_key_env = ""
api_key = ""
ca_cert = ""
timeout_seconds = 120

[[ocr_cleanup.fallback]]
name = "level3"
endpoint = ""
model = ""
api_key_env = ""
api_key = ""
ca_cert = ""
timeout_seconds = 120

[clipboard]
# sequential write: raw first, then overwritten with LLM output
double_injection = true

# --- Optional history: save original file / raw text / LLM-cleaned text ---
# All disabled by default. retention_hours = 0 means "never auto-delete".
[storage]
base_dir = "~/.local/share/bravoric-stt-clipboard/history"

[storage.stt_original]
enabled = false
retention_hours = 0

[storage.stt_raw]
enabled = false
retention_hours = 0

[storage.stt_clean]
enabled = false
retention_hours = 0

[storage.ocr_original]
enabled = false
retention_hours = 0

[storage.ocr_raw]
enabled = false
retention_hours = 0

[storage.ocr_clean]
enabled = false
retention_hours = 0

# --- Output history (tray menu): last N STT/OCR outputs, labeled raw/clean ---
[history]
max_entries = 20

# --- Custom notification icons: absolute path overrides; empty = packaged icon if available,
# otherwise the category's GNOME themed fallback. Invalid/missing paths use that fallback too.
# stt_start means STT processing start (not the recording-start event).
[icons]
stt_start = ""
stt_raw = ""
stt_clean = ""
ocr_start = ""
ocr_raw = ""
ocr_clean = ""
stt_recording_start = ""
stream_session_start = ""
stream_session_end = ""
stream_chunk_delivered = ""
error_general = ""

# --- Streaming dictation (experimental): incolla diretta nel campo in focus ---
# Copia questa sezione in config.toml e personalizza.
[stream]
# Optional exact voice commands (remove/omit all rules to disable).
# [[stream.command]]
# keyword = "invio"
# action = "key"
# key = "Return"
# aliases = ["invito", "in view"] # optional equivalent phrases; exact match, case-insensitive
# ends_session = false
# [[stream.command]]
# keyword = "cancella"
# action = "delete"
# scope = "word" # or "chunk"
# ends_session = false
mode = "per_chunk"              # "at_end" (single recording + final paste) |
                                  # "per_chunk" (chunks split on silences)
language = "it"                  # Streaming transcription language (ISO 639-1 code; "" = auto)
# Giro 18 (P3): this used to be "" while [stt] carried a real text. [stream]
# now repeats the default text that the CODE applies when the key is missing
# or empty (config.DEFAULT_PROMPT). Note this file is the English one: the
# code default is the Italian text (config.py DEFAULT_PROMPT), so this line
# documents the same value rather than translating it. To disable the
# context, drop the key or write your own text.
prompt = "Contesto di dettatura in italiano. Trascrivi fedelmente le parole pronunciate, mantenendo nomi propri, termini tecnici e la lingua originale; usa punteggiatura naturale senza parafrasare. Parole frequenti: dettatura, riconoscimento vocale, appunti, trascrizione."
hotwords = ""                    # Space-separated words/phrases to bias recognition toward
context_enabled = true            # Append the last 3 transcribed chunks to each new prompt

# --- solo per "per_chunk" ---
silence_seconds = 0.7            # durata del silenzio che chiude un chunk (0.1 minimo)
noise_db = -30                   # livello sotto cui conta come silenzio (soglia iniziale:
                                  # il VAD poi adatta la soglia al rumore di fondo misurato)
vad_margin_db = 6.0              # margine (dB) sopra il noise floor adattivo stimato dal VAD
                                  # (0-20; distinto da noise_db, che è solo la soglia iniziale)
min_utterance_seconds = 0.4      # scarta blip più corti (0.1 minimo)
max_utterance_seconds = 30       # flush forzato se parli senza pause
paste_delay_ms = 250
paste_shortcut = "ctrl+v"            # Use "ctrl+shift+v" for terminals/TUIs such as opencode
paste_channel = "clipboard"       # "clipboard" uses the clipboard; "type" sends simulated keystrokes
max_concurrent_chunks = 3         # richieste STT concorrenti (1-8); 0 o assente = AUTO
# max_concurrent_chunks e' il TETTO TOTALE di worker in volo (1-8). 0 o assente
# = AUTO. In AUTO il valore si ricava dagli endpoint paralleli disponibili.
# E' una capienza DIVERSA da max_concurrency dei singoli livelli, che e' il
# tetto per endpoint: i due non vanno confusi e nessuno deriva dall'altro.
# Interruttore GLOBALE parallelo/sequenziale, solo per "per_chunk".
#   "auto"       = comportamento di sempre: se almeno un livello ha
#                  parallel = true parte il dispatcher, altrimenti si degrada
#                  in sequenziale (non e' un errore).
#   "sequential" = catena sequenziale su TUTTI i livelli, e i flag
#                  parallel = true dei singoli livelli vengono IGNORATI.
# Attenzione: i livelli senza parallel = true NON sono un ripiego del pool:
# se un livello e' parallelo, gli altri diventano irraggiungibili.
# max_concurrency vale ANCHE in sequenziale: e' il numero di richieste che
# quell'endpoint puo' servire contemporaneamente, applicato dalla catena su
# tutta la lista dei livelli. Con "sequential" il tetto globale resta quello
# di max_concurrent_chunks: il gate per endpoint LIMITA, non autorizza.
# NON e' a caldo: vale dalla sessione successiva.
dispatch_mode = "auto"             # "auto" | "sequential"
chunk_timeout_seconds = 30.0      # timeout per singolo chunk (secondi)
# Log JSONL dei chunk: una riga per chunk in
# ~/.cache/bravoric-stt-clipboard/chunk_log.jsonl, con provenienza e tempi
# (quale endpoint ha risposto, se ha fatto fallback, in quanto tempo).
# Ritenzione in RIGHE, non in orari: e' uno strumento di debug, non un archivio.
# 0 (o chiave assente) = 2000 righe. Il testo del chunk e' incluso di proposito.
# Si legge con: bravoric-chunk-log --summary
chunk_log_max_lines = 0           # numero massimo di righe tenute (0 = default 2000)
blacklist = "grazie, thank you, sottotitoli a cura di, sottotitoli a cura di whisper, grazie per la visione"   # whole transcription (streaming chunk or dictation) matching a phrase is discarded; case-insensitive. Typical Whisper hallucinations on silence.

# Endpoint dedicato con 3 livelli di fallback (stessa struttura di [stt]/[ocr]).
[[stream.fallback]]
name = "scrocco-llm"
endpoint = "http://10.9.0.2:4001/v1"
model = "scrocco-llm-fissone"
api_key_env = "SCROCCO_FISSONE_API_KEY"
api_key = ""
ca_cert = "~/PiAgent/certs/scrocco-fissone.crt"
timeout_seconds = 120
hotwords_in_prompt = false
# parallel = true mette questo livello nel pool; i livelli senza restano
# raggiungibili solo dalla catena sequenziale.
parallel = false
# Slot CONCORRENTI per questo endpoint (1-8, default 3, MAI auto). Vale
# anche in sequenziale: e' il tetto di richieste contemporanee per endpoint.
max_concurrency = 3

[[stream.fallback]]
name = "level2"
endpoint = ""
model = ""
api_key_env = ""
api_key = ""
ca_cert = ""
timeout_seconds = 120
parallel = false
max_concurrency = 3

[[stream.fallback]]
name = "level3"
endpoint = ""
model = ""
api_key_env = ""
api_key = ""
ca_cert = ""
timeout_seconds = 120
parallel = false
max_concurrency = 3
