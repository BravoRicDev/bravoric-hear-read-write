# Copy to ~/.config/bravoric-stt-clipboard/config.toml and customize.

[general]
notifications = true
clipboard_tool = "wl-copy"
clipboard_paste_tool = "wl-paste"

[notifications]
# STT (voice dictation) — processing started, no content possible
stt_on_processing_start = true
# STT — raw text ready and written to clipboard
stt_on_raw_ready = true
stt_on_raw_ready_content = true
# STT — LLM-cleaned text ready (only if cleanup enabled and successful)
stt_on_cleanup_ready = true
stt_on_cleanup_ready_content = true

# OCR (screenshot) — processing started, no content possible
ocr_on_processing_start = true
# OCR — raw text ready and written to clipboard
ocr_on_raw_ready = true
ocr_on_raw_ready_content = true
# OCR — LLM-cleaned text ready (only if cleanup enabled and successful)
ocr_on_cleanup_ready = true
ocr_on_cleanup_ready_content = true

# Streaming — session start and transcribed text/chunks
stream_on_processing_start = true
stream_on_raw_ready = true
stream_on_raw_ready_content = true

# Every backend notification has its own switch (all default to true).
# STT — microphone started recording
stt_on_recording_start = true
# Streaming — session ended
stream_on_session_end = true
# Errors, per service (a config that cannot be read is always reported)
stt_on_error = true
ocr_on_error = true
stream_on_error = true

[audio]
format = "ogg"
codec = "libopus"
sample_rate = 16000
bitrate_kbps = 16
toggle_debounce_seconds = 1
retry_on_error = true
retry_count = 2

# --- STT: audio transcription -> raw text ---
[stt]
language = "it"                  # Transcription language (ISO 639-1 code; "" = auto-detect)
prompt = "Dictation context in English. Transcribe the spoken words faithfully, preserving proper names, technical terms, and the original language; use natural punctuation without paraphrasing. Common terms: dictation, speech recognition, notes, transcription." # Initial prompt for Whisper
hotwords = ""                    # Space-separated words/phrases to bias recognition toward

[[stt.fallback]]
name = "scrocco-llm"
endpoint = "http://10.9.0.2:4001/v1"
model = "scrocco-llm-fissone"
api_key_env = "SCROCCO_FISSONE_API_KEY"
api_key = ""
ca_cert = "~/PiAgent/certs/scrocco-fissone.crt"
timeout_seconds = 120
hotwords_in_prompt = false

[[stt.fallback]]
name = "level2"
endpoint = ""
model = ""
api_key_env = ""
api_key = ""
ca_cert = ""
timeout_seconds = 120

[[stt.fallback]]
name = "level3"
endpoint = ""
model = ""
api_key_env = ""
api_key = ""
ca_cert = ""
timeout_seconds = 120

# --- STT cleanup: LLM cleanup of transcribed text (optional) ---
[stt_cleanup]
enabled = true
system_prompt = "You are a strict text-correction engine, not a conversational assistant. You will receive text transcribed by a speech-to-text system, possibly containing recognition errors, misheard words, or punctuation mistakes. Fix ONLY these obvious errors. If a sentence is already understandable, even if informal, short, or telegraphic, leave it IDENTICAL: do not reword it, do not change its style or register, do not turn it into an imperative or infinitive form. When in doubt, copy the text as-is instead of rewriting it. Preserve the original meaning, length, and every part of the content, sentence for sentence, in the same order. Do not summarize, shorten, paraphrase, or reword ANY sentence, including the first and the last one. Do not omit any part of the text, do not add words, sentences, or information that were not in the original. Preserve every acronym, abbreviation, technical term, proper noun, file name, and code identifier EXACTLY as given, character for character, even if it looks unusual, misspelled, or repeated letters (e.g. 'STT', 'OCR', package or file names) — never 'fix' or shorten these. Example of correct behavior: input 'Reinforced prompts further' -> output 'Reinforced prompts further' (WRONG: 'Further reinforce the prompts'). Do not reply to the content, do not comment, do not ask questions, do not add introductions, conclusions, or explanations. The corrected text must have the same number of sentences and approximately the same length as the input, in the same language. Output: ONLY the corrected text, nothing else."

[[stt_cleanup.fallback]]
name = "scrocco-llm"
endpoint = "http://10.9.0.2:4001/v1"
model = "scrocco-llm-fissone-200k"
api_key_env = "SCROCCO_FISSONE_API_KEY"
api_key = ""
ca_cert = "~/PiAgent/certs/scrocco-fissone.crt"
timeout_seconds = 120

[[stt_cleanup.fallback]]
name = "level2"
endpoint = ""
model = ""
api_key_env = ""
api_key = ""
ca_cert = ""
timeout_seconds = 120

[[stt_cleanup.fallback]]
name = "level3"
endpoint = ""
model = ""
api_key_env = ""
api_key = ""
ca_cert = ""
timeout_seconds = 120

# --- OCR: text extraction from image (Vision) ---
[[ocr.fallback]]
name = "scrocco-llm"
endpoint = "http://10.9.0.2:4001/v1"
model = "scrocco-llm-fissone"
api_key_env = "SCROCCO_FISSONE_API_KEY"
api_key = ""
ca_cert = "~/PiAgent/certs/scrocco-fissone.crt"
timeout_seconds = 120

[[ocr.fallback]]
name = "level2"
endpoint = ""
model = ""
api_key_env = ""
api_key = ""
ca_cert = ""
timeout_seconds = 120

[[ocr.fallback]]
name = "level3"
endpoint = ""
model = ""
api_key_env = ""
api_key = ""
ca_cert = ""
timeout_seconds = 120

[ocr]
system_prompt = "Extract the text present in the image, verbatim, no markdown, no comments."
# If true, interactively select a screen area (gnome-screenshot) instead of
# reading an image already present in the clipboard. Requires gnome-screenshot.
capture_screenshot = false

# --- OCR cleanup: optional LLM pass over the extracted text ---
[ocr_cleanup]
enabled = false
system_prompt = "Fix ONLY obvious OCR recognition errors: swapped characters, letters missing due to scan errors, words broken in half, missing or doubled spaces. If a sentence or label is already readable and makes sense, even if informal, telegraphic, or not a full grammatical sentence (e.g. a table entry, a title, a short label), leave it IDENTICAL: do not reword it into a full sentence, do not change its style or register, do not add or remove verbs/articles, do not turn it into imperative or infinitive form. When in doubt, copy the text as-is instead of rewriting it. Preserve EXACTLY the markdown formatting (pipe |, tables, backtick, bullet points), every acronym, abbreviation, technical term, file name, and code identifier character for character, even if it looks unusual or has repeated letters (e.g. 'STT', 'OCR'). Example of correct behavior: input 'Reinforced prompts further' -> output 'Reinforced prompts further' (WRONG: 'Further reinforce the prompts'). Do not summarize, paraphrase, translate, or add comments/explanations. Return only the corrected text, with the same length, structure and number of sentences/lines as the input."

[[ocr_cleanup.fallback]]
name = "scrocco-llm"
endpoint = "http://10.9.0.2:4001/v1"
model = "scrocco-llm-fissone-200k"
api_key_env = "SCROCCO_FISSONE_API_KEY"
api_key = ""
ca_cert = "~/PiAgent/certs/scrocco-fissone.crt"
timeout_seconds = 120

[[ocr_cleanup.fallback]]
name = "level2"
endpoint = ""
model = ""
api_key_env = ""
api_key = ""
ca_cert = ""
timeout_seconds = 120

[[ocr_cleanup.fallback]]
name = "level3"
endpoint = ""
model = ""
api_key_env = ""
api_key = ""
ca_cert = ""
timeout_seconds = 120

[clipboard]
# sequential write: raw first, then overwritten with LLM output
double_injection = true

# --- Optional history: save original file / raw text / LLM-cleaned text ---
# All disabled by default. retention_hours = 0 means "never auto-delete".
[storage]
base_dir = "~/.local/share/bravoric-stt-clipboard/history"

[storage.stt_original]
enabled = false
retention_hours = 0

[storage.stt_raw]
enabled = false
retention_hours = 0

[storage.stt_clean]
enabled = false
retention_hours = 0

[storage.ocr_original]
enabled = false
retention_hours = 0

[storage.ocr_raw]
enabled = false
retention_hours = 0

[storage.ocr_clean]
enabled = false
retention_hours = 0

# --- Output history (tray menu): last N STT/OCR outputs, labeled raw/clean ---
[history]
max_entries = 20

# --- Custom notification icons: absolute path overrides; empty = packaged icon if available,
# otherwise the category's GNOME themed fallback. Invalid/missing paths use that fallback too.
# stt_start means STT processing start (not the recording-start event).
[icons]
stt_start = ""
stt_raw = ""
stt_clean = ""
ocr_start = ""
ocr_raw = ""
ocr_clean = ""
stt_recording_start = ""
stream_session_start = ""
stream_processing_start = ""
stream_session_end = ""
stream_chunk_delivered = ""
error_general = ""

# --- Streaming dictation (experimental): pastes straight into the focused field ---
# Copy this section into config.toml and customize it.
[stream]
# Optional exact voice commands (remove/omit all rules to disable).
# [[stream.command]]
# keyword = "invio"
# action = "key"
# key = "Return"
# aliases = ["invito", "in view"] # optional equivalent phrases; exact match, case-insensitive
# ends_session = false
# [[stream.command]]
# keyword = "cancella"
# action = "delete"
# scope = "word" # or "chunk"
# ends_session = false
mode = "per_chunk"              # "at_end" (single recording + final paste) |
                                  # "per_chunk" (chunks split on silences)
language = "it"                  # Streaming transcription language (ISO 639-1 code; "" = auto)
# This repeats the default text that the CODE applies when the key is missing
# or empty (config.DEFAULT_PROMPT). This file is the English one, but the code
# default is the Italian text, so the line documents the same value rather
# than translating it. To disable the context, drop the key or write your own
# text.
prompt = "Contesto di dettatura in italiano. Trascrivi fedelmente le parole pronunciate, mantenendo nomi propri, termini tecnici e la lingua originale; usa punteggiatura naturale senza parafrasare. Parole frequenti: dettatura, riconoscimento vocale, appunti, trascrizione."
hotwords = ""                    # Space-separated words/phrases to bias recognition toward
context_enabled = true            # Append the last 3 transcribed chunks to each new prompt

# --- only for "per_chunk" ---
silence_seconds = 0.7            # silence length that closes a chunk (0.1 minimum)
noise_db = -30                   # level below which it counts as silence (initial threshold:
                                  # the VAD then adapts it to the measured background noise)
vad_margin_db = 6.0              # margin (dB) above the adaptive noise floor estimated by the VAD
                                  # (0-20; distinct from noise_db, which is only the initial threshold)
min_utterance_seconds = 0.4      # drops blips shorter than this (0.1 minimum)
max_utterance_seconds = 30       # forced flush if you speak without pauses
paste_delay_ms = 250
paste_shortcut = "ctrl+v"            # Use "ctrl+shift+v" for terminals/TUIs such as opencode
paste_channel = "clipboard"       # "clipboard" uses the clipboard; "type" sends simulated keystrokes
max_concurrent_chunks = 3         # concurrent STT requests (1-8); 0 or missing = AUTO
# max_concurrent_chunks is the TOTAL CAP of in-flight workers (1-8). 0 or
# missing = AUTO. In AUTO the value is derived from the available parallel
# endpoints. It is a DIFFERENT capacity from the per-level max_concurrency,
# which is the per-endpoint cap: do not confuse them, neither derives from
# the other.
# GLOBAL parallel/sequential switch, only for "per_chunk".
#   "auto"       = the usual behavior: if at least one level has
#                  parallel = true the dispatcher starts, otherwise it falls
#                  back to sequential (this is not an error).
#   "sequential" = sequential chain over ALL levels, and the per-level
#                  parallel = true flags are IGNORED.
# Note: levels without parallel = true are NOT a fallback of the pool:
# if one level is parallel, the others become unreachable.
# max_concurrency applies in sequential mode TOO: it is the number of
# requests that endpoint can serve at the same time, enforced by the chain
# over the whole list of levels. With "sequential" the global cap stays
# max_concurrent_chunks: the per-endpoint gate LIMITS, it does not authorize.
# NOT hot-reloaded: it applies from the next session.
dispatch_mode = "auto"             # "auto" | "sequential"
chunk_timeout_seconds = 30.0      # DEPRECATED, ignored: each level's timeout_seconds decides
# JSONL chunk log: one line per chunk in
# ~/.cache/bravoric-stt-clipboard/chunk_log.jsonl, with provenance and timing
# (which endpoint answered, whether it fell back, how long it took).
# Retention is in LINES, not in time: it is a debugging tool, not an archive.
# 0 (or missing key) = 2000 lines. The chunk text is included on purpose.
# Read it with: bravoric-chunk-log --summary
chunk_log_max_lines = 0           # maximum number of lines kept (0 = default 2000)
blacklist = "grazie, thank you, sottotitoli a cura di, sottotitoli a cura di whisper, grazie per la visione"   # whole transcription (streaming chunk or dictation) matching a phrase is discarded; case-insensitive. Typical Whisper hallucinations on silence.

# Dedicated endpoint with 3 fallback levels (same structure as [stt]/[ocr]).
[[stream.fallback]]
name = "scrocco-llm"
endpoint = "http://10.9.0.2:4001/v1"
model = "scrocco-llm-fissone"
api_key_env = "SCROCCO_FISSONE_API_KEY"
api_key = ""
ca_cert = "~/PiAgent/certs/scrocco-fissone.crt"
timeout_seconds = 120
hotwords_in_prompt = false
# parallel = true puts this level in the pool; levels without it stay
# reachable only through the sequential chain.
parallel = false
# CONCURRENT slots for this endpoint (1-8, default 3, never auto). Applies
# in sequential mode too: it is the cap of simultaneous requests per endpoint.
max_concurrency = 3

[[stream.fallback]]
name = "level2"
endpoint = ""
model = ""
api_key_env = ""
api_key = ""
ca_cert = ""
timeout_seconds = 120
parallel = false
max_concurrency = 3

[[stream.fallback]]
name = "level3"
endpoint = ""
model = ""
api_key_env = ""
api_key = ""
ca_cert = ""
timeout_seconds = 120
parallel = false
max_concurrency = 3
